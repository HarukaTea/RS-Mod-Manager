name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source/Roblox-Studio-Mod-Manager
          persist-credentials: false

      - name: Check out Deploy History dependency
        uses: actions/checkout@v4
        with:
          repository: MaximumADHD/Roblox-Deploy-History
          path: source/Roblox-Deploy-History
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test source/Roblox-Studio-Mod-Manager/Tests/RobloxStudioModManager.Tests.csproj --configuration Release

      - name: Publish Windows executable
        run: dotnet publish source/Roblox-Studio-Mod-Manager/ProjectSrc/RobloxStudioModManager.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RS-Mod-Manager-win-x64
          path: publish/RobloxStudioModManager.exe
          if-no-files-found: error
